services:
  app:
    image: ghcr.io/pjaroslaw/pjarek-gym:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gym
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gym}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_EXERCISE_IMAGE_DIR: /app/exercise-images
      APP_EXERCISE_SYNC_CRON: ${APP_EXERCISE_SYNC_CRON:-0 0 4 * * SUN}
      APP_EXERCISE_SYNC_ZONE: ${APP_EXERCISE_SYNC_ZONE:-UTC}
      APP_EXERCISE_SYNC_ON_STARTUP: ${APP_EXERCISE_SYNC_ON_STARTUP:-true}
      APP_EXERCISE_SYNC_URL: ${APP_EXERCISE_SYNC_URL:-https://codeload.github.com/yuhonas/free-exercise-db/zip/refs/heads/main}
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      - exercise_images:/app/exercise-images
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d gym']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  exercise_images:
