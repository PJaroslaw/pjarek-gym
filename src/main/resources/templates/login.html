<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · PJarek Gym Log</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=png-logo-1" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="login-page">
    <script defer src="/assets/app.js"></script>
    <main class="login-card">
      <a class="brand" href="/">
        <img class="brand-mark" src="/assets/pjarek-gym-log-mark.png" alt="" />
        <span class="brand-copy">
          <strong>PJarek</strong>
          <span>GYM LOG</span>
        </span>
      </a>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue your training.</p>
      <div class="notice" th:if="${param.error}">Username or password was not accepted.</div>
      <div class="notice" th:if="${param.logout}">You have signed out.</div>
      <form method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>
          Username
          <input name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="button primary full">Sign in</button>
      </form>
    </main>
  </body>
</html>
