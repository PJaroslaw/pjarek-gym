<main xmlns:th="http://www.thymeleaf.org"><div class="page-title"><div><span class="eyebrow">ADMINISTRATION</span><h1>Manage users</h1><p>Create accounts and manage access.</p></div></div><section class="panel form-panel"><h2>Invite a user</h2><form class="inline-form" method="post" action="/admin/users"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="username" placeholder="Username" minlength="3" maxlength="80" pattern="[A-Za-z0-9_.-]{3,80}" required><input name="password" type="password" placeholder="Temporary password (12+ characters)" minlength="12" maxlength="200" required><select name="role"><option value="USER">User</option><option value="ADMIN">Admin</option></select><button class="button primary">Create account</button></form></section><section class="panel"><div class="record-row" th:each="u:${users}"><span><a th:href="@{/admin/users/{id}(id=${u.id})}"><strong th:text="${u.username}">user</strong></a><small th:text="${u.role} + ' · ' + ${u.created_at}">Role</small></span><form method="post" th:action="@{/admin/users/{id}/enabled(id=${u.id})}" onsubmit="return this.elements.enabled.value === 'true' || confirm('Disable this user account?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="button small" th:classappend="${u.enabled} ? ' danger' : ' primary'" th:text="${u.enabled} ? 'Disable' : 'Enable'">Disable</button></form></div></section></main>
