<main xmlns:th="http://www.thymeleaf.org">
  <a class="back-link" href="/admin/users">← All users</a>
  <div class="page-title">
    <div>
      <span class="eyebrow">EDIT USER</span>
      <h1 th:text="${account.username}">username</h1>
      <p
        th:text="${account.role} + (${account.enabled} ? ' · Enabled' : ' · Disabled') + (${account.must_change_password} ? ' · Password change required' : '')"
      >
        Role
      </p>
    </div>
    <a class="button secondary" th:href="@{/admin/users/{id}/inspect(id=${account.id})}">Inspect user data</a>
  </div>
  <section class="panel form-panel">
    <div class="section-heading">
      <div>
        <span class="eyebrow">ACCOUNT ACCESS</span>
        <h2>Enable or disable account</h2>
      </div>
    </div>
    <p th:if="${account.username == username}">You cannot disable your own account.</p>
    <form
      class="inline-form"
      th:if="${account.username != username}"
      method="post"
      th:action="@{/admin/users/{id}/enabled(id=${account.id})}"
      onsubmit="return this.elements.enabled.value === 'true' || confirm('Disable this user account?');"
    >
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" name="enabled" th:value="${!account.enabled}" />
      <button
        class="button"
        th:classappend="${account.enabled} ? ' danger' : ' primary'"
        th:text="${account.enabled} ? 'Disable user' : 'Enable user'"
      >
        Disable user
      </button>
    </form>
  </section>
  <section class="panel form-panel">
    <div class="section-heading">
      <div>
        <span class="eyebrow">ACCOUNT ACCESS</span>
        <h2>Set password</h2>
      </div>
    </div>
    <form class="inline-form" method="post" th:action="@{/admin/users/{id}/password(id=${account.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="password" name="password" placeholder="New password" required />
      <select name="temporaryPassword" aria-label="Password type">
        <option value="true">Temporary · require change at next login</option>
        <option value="false">Permanent password</option>
      </select>
      <button class="button secondary">Set password</button>
    </form>
  </section>
  <section class="user-delete-zone" th:if="${account.username != username}">
    <form
      method="post"
      th:action="@{/admin/users/{id}/delete(id=${account.id})}"
      onsubmit="
        return confirm(
          'Permanently delete this user and all of their routines, workouts, and sets? This cannot be undone.',
        );
      "
    >
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="button danger-strong">Delete user and all data</button>
    </form>
  </section>
</main>
