<main xmlns:th="http://www.thymeleaf.org">
  <div class="page-title">
    <div>
      <span class="eyebrow">YOUR ACCOUNT</span>
      <h1>Settings</h1>
      <p>Manage your preferences and account security.</p>
    </div>
  </div>
  <section class="panel form-panel">
    <div class="section-heading">
      <div>
        <span class="eyebrow">PREFERENCES</span>
        <h2>Weight display</h2>
      </div>
    </div>
    <form class="inline-form" method="post" action="/settings/weight-unit">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <select name="unit" required>
        <option value="KG" th:selected="${weightUnit == 'KG'}">Kilograms (kg)</option>
        <option value="LB" th:selected="${weightUnit == 'LB'}">Pounds (lb)</option>
      </select>
      <button class="button secondary">Save</button>
    </form>
  </section>
  <section class="panel form-panel">
    <div class="section-heading">
      <div>
        <span class="eyebrow">APPEARANCE</span>
        <h2>Color mode</h2>
      </div>
    </div>
    <form class="inline-form" method="post" action="/settings/theme-mode">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <select name="mode" id="theme-mode" required>
        <option value="SYSTEM" th:selected="${themeMode == 'SYSTEM'}">System</option>
        <option value="LIGHT" th:selected="${themeMode == 'LIGHT'}">Light</option>
        <option value="DARK" th:selected="${themeMode == 'DARK'}">Dark</option>
      </select>
      <button class="button secondary">Save</button>
    </form>
  </section>
  <section class="panel form-panel">
    <div class="section-heading">
      <div>
        <span class="eyebrow">ACCOUNT SECURITY</span>
        <h2>Change password</h2>
      </div>
    </div>
    <form class="inline-form" method="post" action="/settings/password">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="password" name="currentPassword" placeholder="Current password" required />
      <input type="password" name="newPassword" placeholder="New password" required />
      <button class="button secondary">Update password</button>
    </form>
  </section>
</main>
