<main xmlns:th="http://www.thymeleaf.org">
  <a class="back-link" href="/exercises">← Exercise library</a>
  <section class="detail-layout panel">
    <div class="exercise-photo" th:if="${exercise.source_id != null}">
      <img
        th:src="@{/exercise-images/{id}/{i}(id=${exercise.source_id},i=0)}"
        alt="Exercise demonstration"
        onerror="this.parentElement.style.display = 'none'"
      />
    </div>
    <div class="detail-copy">
      <span class="eyebrow" th:text="${exercise.category}">CATEGORY</span>
      <h1 th:text="${exercise.name}">Exercise</h1>
      <div class="chips">
        <span th:text="${exercise.equipment}">Equipment</span>
        <span th:text="${exercise.primary_muscles}">Muscles</span>
      </div>
      <h2>How to do it</h2>
      <p class="instructions" th:text="${exercise.instructions}">Instruction</p>
      <form method="post" action="/workouts/ad-hoc">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="button primary">Start quick workout</button>
      </form>
    </div>
  </section>
</main>
