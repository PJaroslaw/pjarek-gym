<main xmlns:th="http://www.thymeleaf.org">
  <a class="back-link" href="/routines">← All routines</a>
  <div class="page-title">
    <div>
      <span class="eyebrow">YOUR PROGRAM</span>
      <h1 th:text="${routine.name}">Routine</h1>
      <p>Plan your days, choose movements, then start a session.</p>
    </div>
    <form
      method="post"
      th:action="@{/routines/{id}/delete(id=${routine.id})}"
      onsubmit="return confirm('Delete this routine?');"
    >
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="button danger">Delete routine</button>
    </form>
  </div>
  <form class="panel inline-form rename-form" method="post" th:action="@{/routines/{id}/rename(id=${routine.id})}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input name="name" th:value="${routine.name}" maxlength="160" required />
    <button class="button secondary small">Rename</button>
  </form>
  <section class="panel empty" th:if="${#lists.isEmpty(days)}">No days planned yet. Add your first day below.</section>
  <section class="day-grid">
    <article class="panel day-card" th:each="day:${days}">
      <div class="section-heading day-heading">
        <div>
          <span class="eyebrow" th:text="'DAY ' + ${day.position}">DAY</span>
          <h2 th:text="${day.name}">Day</h2>
          <form
            class="day-rename-form"
            method="post"
            th:action="@{/routines/{id}/days/{dayId}/rename(id=${routine.id},dayId=${day.id})}"
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label class="sr-only" th:for="'day-name-' + ${day.id}">Day name</label>
            <input th:id="'day-name-' + ${day.id}" name="name" th:value="${day.name}" maxlength="120" required />
            <button class="button secondary small">Rename</button>
          </form>
        </div>
        <div class="action-row">
          <form method="post" th:action="@{/routines/{r}/days/{d}/start(r=${routine.id},d=${day.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="button primary small">Start this day →</button>
          </form>
          <form
            method="post"
            th:action="@{/routines/{id}/days/{dayId}/delete(id=${routine.id},dayId=${day.id})}"
            onsubmit="return confirm('Delete this day and its planned exercises? Completed workouts will remain.');"
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="button danger small">Delete day</button>
          </form>
        </div>
      </div>
      <div class="list-row" th:each="item:${items}" th:if="${item.day_id == day.id}">
        <span>
          <strong th:text="${item.exercise_name}">Exercise</strong>
          <small
            th:text="${item.planned_sets} + ' sets · ' + ${item.rep_target} + ' reps · ' + ${item.rest_seconds} + 's rest'"
          >
            3 sets
          </small>
        </span>
        <details class="routine-item-edit">
          <summary>Edit plan</summary>
          <form
            class="routine-item-edit-form"
            method="post"
            th:action="@{/routines/{id}/items/{itemId}/edit(id=${routine.id},itemId=${item.id})}"
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <label>
              Exercise
              <div class="exercise-picker" data-exercise-picker>
                <input
                  type="search"
                  class="exercise-picker-search"
                  placeholder="Search exercises…"
                  autocomplete="off"
                  aria-label="Search exercise"
                  aria-expanded="false"
                  th:value="${item.exercise_name}"
                />
                <input type="hidden" name="exerciseId" th:value="${item.exercise_id}" />
                <div class="exercise-picker-results" role="listbox" hidden>
                  <div class="exercise-picker-message">Type at least 2 characters to search.</div>
                </div>
              </div>
            </label>
            <div class="three-inputs">
              <label>
                Sets
                <input type="number" name="sets" min="1" max="20" th:value="${item.planned_sets}" required />
              </label>
              <label>
                Rep target
                <input name="reps" maxlength="40" th:value="${item.rep_target}" required />
              </label>
              <label>
                Rest sec
                <input type="number" name="rest" min="0" max="900" th:value="${item.rest_seconds}" required />
              </label>
            </div>
            <button class="button secondary small">Save changes</button>
          </form>
        </details>
        <form
          method="post"
          th:action="@{/routines/{id}/items/{itemId}/delete(id=${routine.id},itemId=${item.id})}"
          onsubmit="return confirm('Remove this exercise from the routine?');"
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="icon-button danger" title="Remove exercise">×</button>
        </form>
      </div>
      <form class="add-item-form" method="post" th:action="@{/routines/{id}/items(id=${routine.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="dayId" th:value="${day.id}" />
        <label>
          Exercise
          <div class="exercise-picker" data-exercise-picker>
            <input
              type="search"
              class="exercise-picker-search"
              placeholder="Search exercises…"
              autocomplete="off"
              aria-label="Search exercises"
              aria-expanded="false"
            />
            <input type="hidden" name="exerciseId" />
            <div class="exercise-picker-results" role="listbox" hidden>
              <div class="exercise-picker-message">Type at least 2 characters to search.</div>
            </div>
          </div>
        </label>
        <div class="three-inputs">
          <label>
            Sets
            <input type="number" name="sets" min="1" max="20" value="3" required />
          </label>
          <label>
            Rep target
            <input name="reps" value="8-12" maxlength="40" required />
          </label>
          <label>
            Rest sec
            <input type="number" name="rest" min="0" max="900" value="90" required />
          </label>
        </div>
        <button class="button secondary small">＋ Add exercise</button>
      </form>
    </article>
  </section>
  <form class="panel add-day" method="post" th:action="@{/routines/{id}/days(id=${routine.id})}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input
      name="name"
      placeholder="e.g. Upper body, Pull"
      maxlength="120"
      required
      pattern=".*\S.*"
      title="Enter a day name"
    />
    <button class="button secondary">＋ Add day</button>
  </form>
</main>
