<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="csrf-token" th:content="${_csrf.token}" />
    <meta name="csrf-header" th:content="${_csrf.headerName}" />
    <title th:text="${title} + ' · PJarek Gym Log'">PJarek Gym Log</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=png-logo-1" />
    <link rel="stylesheet" href="/assets/app.css?v=theme-tokens-1" />
    <script defer src="/assets/htmx.min.js"></script>
    <script defer src="/assets/app.js?v=theme-tokens-1"></script>
  </head>
  <body th:fragment="shell(navActive,content)" th:attr="data-theme=${#strings.toLowerCase(themeMode)}">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/">
          <img class="brand-mark" src="/assets/pjarek-gym-log-mark.png" alt="" />
          <span class="brand-copy">
            <strong>PJarek</strong>
            <span>GYM LOG</span>
          </span>
        </a>
        <span class="user-dot mobile-user-dot" th:text="${#strings.substring(username,0,1)}">U</span>
        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="primary-navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <nav id="primary-navigation">
        <a th:classappend="${navActive == 'home'} ? ' selected'" href="/">Overview</a>
        <a th:classappend="${navActive == 'routines'} ? ' selected'" href="/routines">Routines</a>
        <a th:classappend="${navActive == 'exercises'} ? ' selected'" href="/exercises">Exercises</a>
        <a th:classappend="${navActive == 'history'} ? ' selected'" href="/history">History</a>
        <a th:classappend="${navActive == 'settings'} ? ' selected'" href="/settings">Settings</a>
        <a th:if="${isAdmin}" th:classappend="${navActive == 'admin'} ? ' selected'" href="/admin/users">
          User administration
        </a>
        <div class="mobile-menu-account">
          <span th:text="${username}">username</span>
          <form method="post" action="/logout">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="link-button">Sign out</button>
          </form>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <span class="user-dot" th:text="${#strings.substring(username,0,1)}">U</span>
        <span th:text="${username}">username</span>
        <form method="post" action="/logout">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="link-button">Sign out</button>
        </form>
      </div>
    </aside>
    <div class="page">
      <header class="topbar">
        <span class="eyebrow">TRAINING JOURNAL</span>
        <span class="top-date" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, d MMM')}">Today</span>
      </header>
      <div class="content-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
      <main class="content"><th:block th:replace="${content}"></th:block></main>
      <footer>
        Built for consistent work.
        <a href="/exercise-db/LICENSE.md">Exercise data license</a>
      </footer>
    </div>
  </body>
</html>
