<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}"><title th:text="${title} + ' · Repkeeper'">Repkeeper</title><link rel="stylesheet" href="/assets/app.css?v=workout-delete-controls"><script defer src="/assets/htmx.min.js"></script><script defer src="/assets/app.js?v=workout-delete-controls"></script></head>
<body th:fragment="shell(navActive,content)" th:attr="data-theme=${#strings.toLowerCase(themeMode)}"><aside class="sidebar"><a class="brand" href="/">REPKEEPER<span>GYM LOG</span></a><nav><a th:classappend="${navActive == 'home'} ? ' selected'" href="/">Overview</a><a th:classappend="${navActive == 'routines'} ? ' selected'" href="/routines">Routines</a><a th:classappend="${navActive == 'exercises'} ? ' selected'" href="/exercises">Exercises</a><a th:classappend="${navActive == 'history'} ? ' selected'" href="/history">History</a><a th:if="${isAdmin}" href="/admin/users">Manage users</a></nav><div class="sidebar-bottom"><span class="user-dot" th:text="${#strings.substring(username,0,1)}">U</span><span th:text="${username}">username</span><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Sign out</button></form></div></aside>
<div class="page"><header class="topbar"><span class="eyebrow">TRAINING JOURNAL</span><span class="top-date" th:text="${#temporals.format(#temporals.createNow(), 'EEEE, d MMM')}">Today</span></header><div class="content-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div><main class="content" th:replace="${content}"></main><footer>Built for consistent work. <a href="/exercise-db/LICENSE.md">Exercise data license</a></footer></div></body>
</html>
