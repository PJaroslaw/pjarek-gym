<main xmlns:th="http://www.thymeleaf.org"><div class="page-title"><div><span class="eyebrow">EVERY SESSION COUNTS</span><h1>Workout history</h1><p>Look back at the work you’ve put in.</p></div></div><div class="two-col"><section class="panel"><div class="section-heading"><div><span class="eyebrow">RECENT</span><h2>Completed sessions</h2></div></div><div class="empty" th:if="${#lists.isEmpty(history)}">Finish a workout and it will show up here.</div><div class="list-row workout-record-row" th:each="w:${history}"><a th:href="@{/workouts/{id}(id=${w.id})}"><span><strong th:text="${w.title}">Workout</strong><small th:text="${#dates.format(w.completed_at,'d MMM yyyy · HH:mm')} + ' · ' + ${w.sets} + ' sets'">Date</small></span><span class="badge" th:text="${#numbers.formatDecimal(w.volume,1,0)} + ' kg volume'">0 vol</span></a><form method="post" th:action="@{/workouts/{id}/delete(id=${w.id},returnTo='history')}" onsubmit="return confirm('Delete this completed workout and its logged sets? This cannot be undone.')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button danger small">Delete</button></form></div></section><section class="panel"><div class="section-heading"><div><span class="eyebrow">PERSONAL BESTS</span><h2>Top lifts</h2></div></div><div class="empty" th:if="${#lists.isEmpty(records)}">Your bests appear as you log workouts.</div><div class="record-row" th:each="r:${records}"><span><strong th:text="${r.name}">Exercise</strong><small th:text="${r.max_reps} + ' reps best'">reps</small></span><strong th:text="|${r.max_weight} ${r.weight_unit}|">weight</strong></div></section></div></main>
