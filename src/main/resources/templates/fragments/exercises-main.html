<main xmlns:th="http://www.thymeleaf.org">
  <div class="page-title">
    <div>
      <span class="eyebrow">MOVE WITH INTENTION</span>
      <h1>Exercise library</h1>
      <p>Browse movements, equipment, muscles, and instructions.</p>
    </div>
    <form method="post" action="/workouts/ad-hoc">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="button primary">＋ Quick workout</button>
    </form>
  </div>
  <section class="panel">
    <label class="searchbox">
      <span>⌕</span>
      <input
        type="search"
        name="q"
        maxlength="100"
        placeholder="Search movements, muscles, equipment…"
        th:value="${q}"
        hx-get="/exercises"
        hx-trigger="input changed delay:250ms, search"
        hx-target="#exercise-results"
        hx-push-url="true"
      />
    </label>
    <div id="exercise-results" class="exercise-list" th:insert="~{fragments/exercises :: rows}"></div>
  </section>
  <p class="attribution">
    Exercise content from Free Exercise DB · Public domain ·
    <a href="/exercise-db/LICENSE.md">License</a>
  </p>
</main>
