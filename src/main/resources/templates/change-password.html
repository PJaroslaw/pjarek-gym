<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Choose a password · Repkeeper</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="login-page" data-theme="system">
    <main class="login-card">
      <a class="brand" href="/">
        REPKEEPER
        <span>GYM LOG</span>
      </a>
      <h1>Choose a password</h1>
      <p>Your administrator gave you a temporary password. Set a new password to continue.</p>
      <form method="post" action="/change-password">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>
          New password
          <input type="password" name="newPassword" autocomplete="new-password" required autofocus />
        </label>
        <button class="button primary full">Save password</button>
      </form>
      <form method="post" action="/logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="link-button">Sign out</button>
      </form>
    </main>
  </body>
</html>
